spring:
  application:
    name: desafio-junior-backend-simplify
  datasource:
    url: jdbc:postgresql://localhost:5432/simplify
    driver-class-name: org.postgresql.Driver
    hikari:
      password: postgres
      username: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect